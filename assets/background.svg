<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- Placeholder parallax background scene. Swap for your own artwork; keep it wide/seamless for horizontal scrolling. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec6ff"/>
      <stop offset="70%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd694"/>
      <stop offset="100%" stop-color="#6bc26f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb562"/>
      <stop offset="100%" stop-color="#409144"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="640" fill="url(#sky)"/>

  <circle cx="1420" cy="110" r="60" fill="#fff59d"/>
  <circle cx="1420" cy="110" r="80" fill="#fff59d" opacity="0.35"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(120,90)">
      <ellipse cx="0" cy="0" rx="45" ry="22"/>
      <ellipse cx="40" cy="-8" rx="35" ry="20"/>
      <ellipse cx="-38" cy="-6" rx="32" ry="18"/>
    </g>
    <g transform="translate(560,160)">
      <ellipse cx="0" cy="0" rx="50" ry="24"/>
      <ellipse cx="46" cy="-6" rx="34" ry="19"/>
      <ellipse cx="-42" cy="-4" rx="30" ry="17"/>
    </g>
    <g transform="translate(980,80)">
      <ellipse cx="0" cy="0" rx="40" ry="20"/>
      <ellipse cx="36" cy="-6" rx="28" ry="16"/>
    </g>
    <g transform="translate(1300,220)">
      <ellipse cx="0" cy="0" rx="38" ry="18"/>
      <ellipse cx="32" cy="-6" rx="26" ry="15"/>
      <ellipse cx="-30" cy="-4" rx="24" ry="14"/>
    </g>
  </g>

  <!-- far hills -->
  <g fill="url(#hillFar)">
    <ellipse cx="150" cy="560" rx="220" ry="120"/>
    <ellipse cx="520" cy="580" rx="260" ry="130"/>
    <ellipse cx="900" cy="560" rx="240" ry="120"/>
    <ellipse cx="1300" cy="580" rx="260" ry="130"/>
    <ellipse cx="1600" cy="560" rx="220" ry="120"/>
  </g>

  <!-- near hills -->
  <g fill="url(#hillNear)">
    <ellipse cx="0" cy="620" rx="180" ry="100"/>
    <ellipse cx="340" cy="640" rx="220" ry="110"/>
    <ellipse cx="720" cy="620" rx="200" ry="100"/>
    <ellipse cx="1080" cy="640" rx="220" ry="110"/>
    <ellipse cx="1440" cy="620" rx="200" ry="100"/>
  </g>

  <!-- distant bushes for texture -->
  <g fill="#4a9a4e" opacity="0.7">
    <ellipse cx="260" cy="600" rx="30" ry="16"/>
    <ellipse cx="640" cy="610" rx="34" ry="18"/>
    <ellipse cx="1040" cy="600" rx="30" ry="16"/>
    <ellipse cx="1420" cy="610" rx="34" ry="18"/>
  </g>
</svg>
